name: CI

on:
    push:
        branches:
            - dev

jobs:
    test:
        name: run tests
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v2
            - name: update /etc/hosts
              run: |
                  sudo echo "172.17.0.1 host.docker.internal" | sudo tee -a /etc/hosts
                  cat /etc/hosts
            - name: start db
              run: |
                  cd .github/workflows/support
                  docker compose up -d db
            - name: wait for db
              run: |
                  cd .github/workflows/support
                  ./wait.sh
            - name: build dev environment
              run: |
                  cd .github/workflows/support
                  docker compose build dev
            - name: tests
              run: |
                  cd .github/workflows/support
                  docker compose run --service-ports --rm --name ubuntu-yop dev ./run.sh
