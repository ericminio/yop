<!DOCTYPE html>
<html lang="en">
    <head>
        <title>About routes</title>
        <script src="/yop.js"></script>
        <script>
            customElements.define(
                'home-page',
                class extends HTMLElement {
                    connectedCallback() {
                        this.innerHTML = `
                          <section>
                            <h1>Home Page</h1>
                            <p>Welcome</p>
                            <label for="navigate">Navigate to</label>
                            <input id="navigate" type="text" />
                            <button id="go">go</button>
                          </section>`;
                        this.querySelector('#go').addEventListener(
                            'click',
                            () => {
                                const path =
                                    this.querySelector('#navigate').value;
                                navigate.to(path);
                            }
                        );
                    }
                }
            );
            customElements.define(
                'about-page',
                class extends HTMLElement {
                    connectedCallback() {
                        this.innerHTML = `
                          <section>
                            <h1>About Page</h1>
                            <p>We are magicians</p>
                          </section>`;
                    }
                }
            );
            customElements.define(
                'search-page',
                class extends HTMLElement {
                    connectedCallback() {
                        const params = new URLSearchParams(
                            this.getAttribute('searchParams')
                        );
                        const criteria = params.get('criteria');
                        this.innerHTML = `
                          <section>
                            <h1>Results</h1>
                            <p>Criteria was: ${criteria}</p>
                          </section>`;
                    }
                }
            );
            customElements.define(
                'product-page',
                class extends HTMLElement {
                    connectedCallback() {
                        const id = this.getAttribute('data-id');
                        this.innerHTML = `
                          <section>
                            <h1>Product</h1>
                            <p>id: ${id}</p>
                          </section>`;
                    }
                }
            );
            customElements.define(
                'order-item-page',
                class extends HTMLElement {
                    connectedCallback() {
                        const orderId = this.getAttribute('data-order-id');
                        const itemId = this.getAttribute('data-item-id');
                        this.innerHTML = `
                          <section>
                            <h1>Order item</h1>
                            <p>order_id: ${orderId}</p>
                            <p>item_id: ${itemId}</p>
                          </section>`;
                    }
                }
            );
        </script>
    </head>

    <body>
        <yop-route when="/" then="home-page"></yop-route>
        <yop-route when="/about" then="about-page"></yop-route>
        <yop-route when="/search" then="search-page"></yop-route>
        <yop-route when="/product/:id" then="product-page"></yop-route>
        <yop-route
            when="/orders/:order-id/items/:item-id"
            then="order-item-page"
        ></yop-route>
    </body>
</html>
