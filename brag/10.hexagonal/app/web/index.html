<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Hexagonal</title>
        <script src="/yop.js"></script>
        <script src="/app.js"></script>
        <script>
            state.ports = {
                nextChallenge: async () => ({
                    question: 'What should we do now?',
                    choices: [
                        { choice: 'Waterfall' },
                        { choice: 'Test-Driven Development' },
                        { choice: 'A little of both' },
                    ],
                    isLast: true,
                }),
                validateAnswer: async ({ answer, question }) => ({
                    isCorrect: answer === 'Test-Driven Development',
                    correctAnswer: 'Test-Driven Development',
                }),
            };
            nextChallenge();
        </script>
    </head>

    <body>
        <yop-route when="/" then="home-page"></yop-route>
    </body>
</html>
